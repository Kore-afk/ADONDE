<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - ADONDE</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Custom Style System -->
    <link rel="stylesheet" href="../styles/styles.css">
    <!-- Deferred Common Script -->
    <script src="../js/functions.js" defer></script>
</head>
<body>
    <!-- Top Navigation -->
    <nav class="navbar fixed-top navbar-expand-lg navbar-dark bg-transparent">
        <div class="container">
            <a class="navbar-brand fw-extrabold" href="#">MI PERFIL</a>
            <div class="d-flex align-items-center">
                <a href="../index.html" class="btn btn-outline-secondary btn-sm px-3 py-2" onclick="localStorage.clear()">
                    <i class="fas fa-sign-out-alt me-1"></i> Cerrar Sesión
                </a>
            </div>
        </div>
    </nav>

    <!-- Profile View Container -->
    <div class="container mt-5 pt-5" id="profileContainer">
        <div class="card max-width-600 mx-auto mt-2" style="max-width: 650px;">
            <div class="card-body p-4">
                <!-- Profile Header Details -->
                <div class="text-center mb-4">
                    <div class="perfil-imagen-container mb-3">
                        <img src="" alt="Foto de perfil" class="rounded-circle perfil-imagen" style="width: 130px; height: 130px; object-fit: cover;">
                    </div>
                    <h2 class="card-title mb-2" style="font-weight: 800; color: #ffffff;">Cargando...</h2>
                    <p class="card-text text-secondary px-3" style="font-size: 0.95rem; line-height: 1.5; font-style: italic;">Cargando biografía...</p>
                </div>
                
                <hr style="border-color: rgba(255,255,255,0.08);">
                
                <!-- Detailed Fields Section -->
                <div class="mb-4">
                    <!-- Loaded dynamically via functions.js -->
                </div>
                
                <!-- Actions -->
                <div class="d-flex justify-content-around">
                    <button class="btn btn-primary px-4 py-2" data-bs-toggle="modal" data-bs-target="#editProfileModal">
                        <i class="fas fa-edit me-1"></i> Editar Perfil
                    </button>
                    <button class="btn btn-outline-secondary px-4 py-2" onclick="showToast('Configuración guardada.')">
                        <i class="fas fa-cog me-1"></i> Configuración
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Profile Modal -->
    <div class="modal fade" id="editProfileModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" style="font-weight: 800;"><i class="fas fa-user-edit me-2" style="color: var(--accent-blue);"></i>Editar Datos del Perfil</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="editProfileForm">
                        <div class="mb-3">
                            <label class="form-label" style="font-weight: 600; font-size: 0.9rem;">Nombre Completo</label>
                            <input type="text" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" style="font-weight: 600; font-size: 0.9rem;">Correo Electrónico</label>
                            <input type="email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" style="font-weight: 600; font-size: 0.9rem;">Teléfono</label>
                            <input type="text" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" style="font-weight: 600; font-size: 0.9rem;">Universidad</label>
                            <input type="text" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" style="font-weight: 600; font-size: 0.9rem;">Carrera</label>
                            <input type="text" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" style="font-weight: 600; font-size: 0.9rem;">Biografía / Descripción corta</label>
                            <textarea class="form-control" rows="3" required></textarea>
                        </div>
                        <div class="modal-footer pb-0 px-0">
                            <button type="button" class="btn btn-outline-secondary px-3 py-2" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-primary px-4 py-2">Guardar Cambios</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation (iOS-Style Floating) -->
    <nav class="navbar fixed-bottom navbar-dark">
        <div class="container-fluid justify-content-around">
            <a class="navbar-brand" href="eventos.html"><i class="fas fa-glass-cheers"></i></a>
            <a class="navbar-brand" href="marketplace-ventas.html"><i class="fas fa-store"></i></a>
            <a class="navbar-brand" href="notificaciones.html"><i class="fas fa-bell"></i></a>
            <a class="navbar-brand active" href="perfil.html"><i class="fas fa-user"></i></a>
        </div>
    </nav>

    <!-- Bootstrap Bundle with Popper JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

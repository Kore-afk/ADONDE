<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace - ADONDE</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Custom Style System -->
    <link rel="stylesheet" href="../styles/styles.css">
    <!-- Deferred Common Script -->
    <script src="../js/functions.js" defer></script>
</head>
<body>
    <!-- Top Navigation -->
    <nav class="navbar fixed-top navbar-expand-lg navbar-dark bg-transparent">
        <div class="container">
            <a class="navbar-brand fw-extrabold" href="#">E-BAZAR</a>
            <div class="d-flex align-items-center">
                <!-- Search Input Group -->
                <div class="input-group me-3" style="max-width: 320px;">
                    <input type="text" class="form-control" placeholder="Buscar productos..." aria-label="Buscar productos">
                    <button class="btn btn-outline-secondary" type="button">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
                <button class="btn btn-primary px-3 py-2" data-bs-toggle="modal" data-bs-target="#newProductModal">
                    <i class="fas fa-plus me-1"></i> Vender
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container mt-5 pt-5">
        <!-- Categories Filters -->
        <div class="row mb-4 mt-2">
            <div class="col-12">
                <div class="d-flex gap-3 overflow-auto pb-2">
                    <button class="btn btn-primary active px-4 py-2">Todo</button>
                    <button class="btn btn-outline-primary px-4 py-2">Libros</button>
                    <button class="btn btn-outline-primary px-4 py-2">Electrónicos</button>
                    <button class="btn btn-outline-primary px-4 py-2">Ropa</button>
                    <button class="btn btn-outline-primary px-4 py-2">Accesorios</button>
                    <button class="btn btn-outline-primary px-4 py-2">Otros</button>
                </div>
            </div>
        </div>

        <!-- Dynamic Products Grid -->
        <div class="row g-4" id="productsContainer">
            <!-- Content injected dynamically by functions.js -->
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Cargando productos...</span>
                </div>
            </div>
        </div>
    </div>

    <!-- New Product Modal -->
    <div class="modal fade" id="newProductModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" style="font-weight: 800;"><i class="fas fa-cart-plus me-2" style="color: var(--accent-blue);"></i>Publicar Producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="newProductForm">
                        <div class="mb-3">
                            <label class="form-label" style="font-weight: 600; font-size: 0.9rem;">Nombre del producto</label>
                            <input type="text" class="form-control" placeholder="Ej. Calculadora Texas TI-84" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" style="font-weight: 600; font-size: 0.9rem;">Categoría</label>
                            <select class="form-select">
                                <option>Libros</option>
                                <option>Electrónicos</option>
                                <option>Ropa</option>
                                <option>Accesorios</option>
                                <option>Otros</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" style="font-weight: 600; font-size: 0.9rem;">Precio (MXN)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-secondary border-glass text-secondary" style="border-right: none;">$</span>
                                <input type="number" class="form-control" placeholder="0.00" required style="border-left: none;">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" style="font-weight: 600; font-size: 0.9rem;">Descripción</label>
                            <textarea class="form-control" rows="3" placeholder="Describe las condiciones del artículo, detalles de entrega en campus..." required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" style="font-weight: 600; font-size: 0.9rem;">Imágenes (Muestra)</label>
                            <input type="file" class="form-control" accept="image/*">
                            <small class="text-muted mt-1 d-block" style="font-size: 0.75rem;">Para la demostración local se generará una imagen aleatoria premium representativa.</small>
                        </div>
                        <div class="modal-footer pb-0 px-0">
                            <button type="button" class="btn btn-outline-secondary px-3 py-2" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-primary px-4 py-2">Publicar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation (iOS-Style Floating) -->
    <nav class="navbar fixed-bottom navbar-dark">
        <div class="container-fluid justify-content-around">
            <a class="navbar-brand" href="eventos.html"><i class="fas fa-glass-cheers"></i></a>
            <a class="navbar-brand active" href="marketplace-ventas.html"><i class="fas fa-store"></i></a>
            <a class="navbar-brand" href="notificaciones.html"><i class="fas fa-bell"></i></a>
            <a class="navbar-brand" href="perfil.html"><i class="fas fa-user"></i></a>
        </div>
    </nav>

    <!-- Bootstrap Bundle with Popper JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificaciones - ADONDE</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Custom Style System -->
    <link rel="stylesheet" href="../styles/styles.css">
    <!-- Deferred Common Script -->
    <script src="../js/functions.js" defer></script>
</head>
<body>
    <!-- Top Navigation -->
    <nav class="navbar fixed-top navbar-expand-lg navbar-dark bg-transparent">
        <div class="container">
            <a class="navbar-brand fw-extrabold" href="#">Notificaciones</a>
            <div class="d-flex align-items-center">
                <button class="btn btn-outline-secondary btn-sm px-3 py-2">
                    <i class="fas fa-check-double me-1"></i> Marcar todo como leído
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container mt-5 pt-5">
        <!-- Notification Filters -->
        <div class="row mb-4 mt-2">
            <div class="col-12">
                <div class="btn-group w-100 border-glass" style="border-radius: 12px; overflow: hidden;">
                    <button class="btn btn-primary active py-2">Todas</button>
                    <button class="btn btn-outline-primary py-2">Eventos</button>
                    <button class="btn btn-outline-primary py-2">Marketplace</button>
                </div>
            </div>
        </div>

        <!-- Notifications List -->
        <div class="row">
            <div class="col-12">
                <div class="card shadow-sm mb-4">
                    <div class="list-group list-group-flush" id="notificationsContainer">
                        <!-- Content injected dynamically by functions.js -->
                        <div class="text-center py-5">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Cargando notificaciones...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation (iOS-Style Floating) -->
    <nav class="navbar fixed-bottom navbar-dark">
        <div class="container-fluid justify-content-around">
            <a class="navbar-brand" href="eventos.html"><i class="fas fa-glass-cheers"></i></a>
            <a class="navbar-brand" href="marketplace-ventas.html"><i class="fas fa-store"></i></a>
            <a class="navbar-brand active" href="notificaciones.html"><i class="fas fa-bell"></i></a>
            <a class="navbar-brand" href="perfil.html"><i class="fas fa-user"></i></a>
        </div>
    </nav>

    <!-- Bootstrap Bundle with Popper JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
